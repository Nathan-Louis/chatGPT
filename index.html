<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Un site interactif avec générateur de citations, convertisseur de devises et formulaire d'inscription sécurisé."
    />
    <meta property="og:title" content="Site Web Interactif" />
    <meta
      property="og:description"
      content="Découvrez notre site interactif avec citations, conversion de devises et plus encore !"
    />
    <meta property="og:type" content="website" />
    <title>Site Web Optimisé</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script defer src="./js/index.js"></script>
  </head>
  <body>
    <header>
      <h1>Bienvenue sur notre site interactif</h1>
    </header>
    <main>
      <!-- Bouton pour changer la couleur de fond -->
      <section>
        <button id="changeColorBtn">Changer la couleur</button>
        <p id="colorText">Couleur actuelle : #ffffff</p>
      </section>

      <!-- Générateur de citations -->
      <section>
        <button id="quoteButton">Obtenir une citation</button>
        <p id="quoteText">Cliquez pour une citation</p>
        <p id="quoteAuthor"></p>
        <button id="saveQuoteButton">Sauvegarder cette citation</button>
        <p id="favoriteQuote">Citation favorite : Aucune</p>
      </section>

      <!-- Bouton Scroll To Top -->
      <button id="scrollTopBtn" aria-label="Remonter en haut">↑</button>

      <!-- Convertisseur de devises -->
      <section>
        <input
          type="number"
          id="amount"
          placeholder="Montant"
          aria-label="Montant à convertir"
        />
        <select id="fromCurrency" aria-label="Devise de départ">
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
        </select>
        <select id="toCurrency" aria-label="Devise de destination">
          <option value="EUR">EUR</option>
          <option value="USD">USD</option>
        </select>
        <button id="convertButton">Convertir</button>
        <p id="result">Résultat :</p>
        <p id="change">Taux de change :</p>
      </section>

      <!-- Formulaire d'inscription sécurisé -->
      <section>
        <form id="signupForm">
          <input type="text" id="nom" placeholder="Nom" required />
          <input type="text" id="prenom" placeholder="Prénom" required />
          <input type="email" id="email" placeholder="Email" required />
          <input
            type="password"
            id="password"
            placeholder="Mot de passe"
            required
            minlength="8"
          />
          <input
            type="password"
            id="passwordValidation"
            placeholder="Confirmer le mot de passe"
            required
          />
          <label
            ><input type="checkbox" id="cgu" required /> J'accepte les
            CGU</label
          >
          <button type="submit">S'inscrire</button>
          <p id="formMessage"></p>
        </form>
      </section>
    </main>
    <footer>
      <p>&copy; 2025 - Tous droits réservés</p>
    </footer>
  </body>
</html>
